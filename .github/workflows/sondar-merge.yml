name: Sondagem MERGE/CHIRPS (monitor climático)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sondar-merge.yml", "scripts/sondar_merge.py"]
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: mkdir -p monitor-climatico/dados && python3 scripts/sondar_merge.py > monitor-climatico/dados/sondagem.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-climatico/dados/sondagem.txt && git commit -qm "Sondagem MERGE/CHIRPS" && git pull -q --rebase && git push -q || true
